
[env]
TERM = "xterm-256color"

[window]
decorations = "buttonless"
dynamic_padding = false
opacity = 1

[window.padding]
x = 10
y = 10

[cursor]
style.shape = "Beam"

[terminal.shell]
program = "/opt/homebrew/bin/fish"


[mouse]
hide_when_typing = true

[font]
size = 16.75

# [font.normal]
# family = "GeistMono Nerd Font"
# style = "Medium"


[font.normal]
# family = "GeistMono Nerd Font"
family = "IoskeleyMono Nerd Font"
style = "Medium"

[general]
live_config_reload = true

# Theme
# import = ["./colorschems/gruvbox_dark_hard.toml"]
# import = ["./gruvbox_dark_hard.toml"]
import = ["./colorschems/gruvbox-material/hard.toml"]


[colors]
draw_bold_text_with_bright_colors = true

[keyboard]
bindings = [{ key = "T", mods = "Command", action = "CreateNewWindow" }]
